<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>svg-morph — Pattern Studio</title>
    <link rel="stylesheet" href="./css/shared.css">
    <link rel="stylesheet" href="./css/control-card.css">
    <link rel="stylesheet" href="./css/marker-heading.css">

    <style>
    .pattern-bg {
      /* The pattern is the normal page background: it scrolls with the
         content. Only the header stays fixed on top. */
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.9;
    }
    .pattern-bg svg {
      display: block;
      width: 100%;
      height: 100%;
      /* Combine filters so any palette renders vivid and deep: boost color
         saturation, lift brightness and keep contrast punchy. */
      filter: saturate(1.35) contrast(1.06) brightness(1.06);
    }
    .pattern-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      /* Soft vignette: draws attention to the middle and lets the dialog and
         text stay readable no matter how bright or busy the pattern is. */
      background: radial-gradient(
        120% 95% at 50% 22%,
        rgba(10, 10, 20, 0) 35%,
        rgba(10, 10, 20, 0.55) 100%
      );
      pointer-events: none;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }
    .family-desc {
      margin: -0.5rem 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .preset-row {
      display: flex;
      gap: 0.5rem;
    }
    .preset-row input[type="text"] {
      flex: 1;
      min-width: 0;
    }
    pattern-tiles {
      --pattern-tiles-accent: var(--pattern-accent, var(--accent));
    }
    /* The two randomize buttons share the width of the card, side by side. */
    .randomize-row {
      display: flex;
      gap: 0.5rem;
    }
    .randomize-row button {
      flex: 1;
    }
    .page-title {
      text-align: center;
    }
    </style>
  </head>
  <body>
    <%= headerPartial %>

    <div class="pattern-bg" id="pattern-bg" aria-hidden="true"></div>

    <main class="page">
      <div class="hero">
        <div class="page-title">
          <h1 class="marker-heading" style="color:#000; --marker-color: #fff; --marker-opacity: 0.6; --marker-stroke-tilt: -5deg;">
            <span class="heading-text">
              <!-- No band markup at all: the marker band is a ::before on
                   .heading-text, one tile image repeated horizontally. The
                   tile, the color and the tilt are all set in
                   css/marker-heading.css. -->
              Pattern Studio
            </span>
          </h1>

        </div>

        <div class="control-card">
          <h2>Controls</h2>

          <div class="field">
            <label for="pattern">Pattern</label>
            <!-- A native <select> draws its list as a popup of the browser or the
                 operating system, outside the page and beyond any CSS, so the
                 studio brings its own: <jd-select> is a select with a list that
                 stays in the page. It takes the same options, the same events
                 and the same keyboard as the original; the studio fills the
                 options in and sets the pattern that is drawn. -->
            <jd-select id="pattern"></jd-select>
          </div>
          <p class="family-desc" id="pattern-desc"></p>

          <div class="seed-row">
            <input type="number" id="seed" min="0" step="1" aria-label="Pattern seed">
            <button type="button" id="seed-random">🎲 Random seed</button>
          </div>

          <div class="field">
            <label for="count" id="density-label">Shapes per tile</label>
            <output id="count-readout" for="count"></output>
            <input type="range" id="count" min="1" max="120" step="1">
          </div>

          <div class="field">
            <label for="size" id="size-label">Tile size</label>
            <output id="size-readout" for="size"></output>
            <input type="range" id="size" min="40" max="400" step="10">
          </div>

          <div class="field">
            <label for="opacity">Opacity</label>
            <output id="opacity-readout" for="opacity"></output>
            <input type="range" id="opacity" min="0.1" max="1" step="0.05">
          </div>

          <div class="field">
            <label for="colors">Colors</label>
            <output id="colors-readout" for="colors"></output>
            <input type="range" id="colors" min="1" max="8" step="1">
          </div>

          <div class="field">
            <label for="hue">Hue</label>
            <output id="hue-readout" for="hue"></output>
            <input type="range" id="hue" min="0" max="360" step="1">
          </div>

          <!-- Every pattern has these six sliders, none of them hidden, so
               switching between two patterns never moves anything around. -->
          <div class="field">
            <label for="rotation">Rotation</label>
            <output id="rotation-readout" for="rotation"></output>
            <input type="range" id="rotation" min="0" max="360" step="1">
          </div>

          <!-- The controls of the chosen pattern are built into here, because
               every pattern brings its own: a slider for a number, a chooser for
               a fixed list of values. -->
          <div id="pattern-fields"></div>

          <!-- Two buttons for the same thing at two depths: one draws a new
               pattern as well, the other keeps the pattern and only redraws
               everything below it. Both leave the opacity alone, because it says
               how strongly the pattern should read against the page. -->
          <div class="randomize-row">
            <button type="button" id="randomize-all" class="randomize-all">
              🎲 Random all
            </button>
            <button type="button" id="randomize-in-place">
              🎲 Random all but Pattern, Opacity
            </button>
          </div>

          <div class="card-block">
            <h2>Pattern file</h2>
            <div class="card-actions">
              <button type="button" id="pattern-download">Download SVG</button>
              <button type="button" id="pattern-copy">Copy SVG</button>
            </div>
            <p class="card-status" id="pattern-file-status" hidden></p>
          </div>

          <div class="card-block">
            <h2>Presets</h2>
            <div class="preset-row">
              <input type="text" id="preset-name" placeholder="Preset name" aria-label="Preset name">
              <button type="button" id="preset-save">Save</button>
            </div>
            <!-- The saved patterns as small tiles: every tile draws the pattern
                 it stands for, and its name comes up on hover. The element draws
                 itself, so the studio only hands it the patterns and listens
                 for what is picked. -->
            <pattern-tiles id="preset-list"></pattern-tiles>
            <div class="card-actions">
              <button type="button" id="preset-export">Export</button>
              <button type="button" id="preset-import">Import</button>
              <input type="file" id="preset-file" accept="application/json,.json" hidden>
            </div>
            <p class="card-status" id="preset-status" hidden></p>
          </div>
        </div>
      </div>
    </main>

    <%= footerPartial %>
  </body>
</html>
