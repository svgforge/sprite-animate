<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>svg-morph — Demo</title>
    <link rel="stylesheet" href="./css/shared.css">
    <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .card h3 {
      margin: 0 0 1rem;
      font-size: 1rem;
      color: var(--accent);
    }
    .card p {
      margin: 0 0 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    code {
      display: block;
      margin-top: 0.75rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.4rem 0.5rem;
      border-radius: 3px;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .example {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    button {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(0, 212, 255, 0.4);
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    button:hover {
      background: rgba(0, 212, 255, 0.3);
    }
    </style>
  </head>
  <body>
    <%= headerPartial %>

    <main class="page">
      <div class="page-title">
        <h1>Demo</h1>
        <p>All features of the web component at a glance</p>
      </div>

      <!-- Cards are generated by src/demo.ts from the current sprite.svg -->
      <div class="grid" id="demo-grid"></div>
    </main>

    <%= footerPartial %>
  </body>
</html>
